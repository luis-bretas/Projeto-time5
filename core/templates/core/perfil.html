<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Perfil - Move Together</title>

    <style>
        nav{
    background-color: #111827;
    padding: 16px 30px;
    display: flex;
    gap: 24px;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
}

nav a{
    color: white;
    text-decoration: none;
    font-weight: bold;
    font-size: 16px;
}

nav a:hover{
    color: #60a5fa;
}
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .perfil-box{
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.15);
        }

        h1{
            color: #111827;
        }

        p{
            font-size: 18px;
        }

        button{
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background: #1d4ed8;
        }
    </style>
</head>

<body>
<nav>
    <a href="/">Home</a>
    <a href="/login/">Login</a>
    <a href="/dashboard/">Dashboard</a>
    <a href="/grupo/">Grupo</a>
    <a href="/perfil/">Perfil</a>
    <a href="/atividade/">Atividade</a>
    <a href="/ranking/">Ranking</a>
</nav>
<div class="perfil-box">

    <h1>Meu Perfil</h1>

    <p><strong>Nome:</strong> {{ usuario.nome }}</p>
    <p><strong>Pontos:</strong> {{ usuario.pontos }}</p>
    <p><strong>Nível:</strong> {{ usuario.nivel }}</p>
    <p><strong>Esporte Favorito:</strong> {{ usuario.esporte }}</p>

    <button>Editar Perfil</button>

</div>

</body>
</html>
