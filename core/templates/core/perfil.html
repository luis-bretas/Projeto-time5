<!DOCTYPE html>
<html lang="pt-br">
<head>
    <title>Perfil - Move Together</title>

    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .perfil-box{
            width: 400px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0px 2px 10px rgba(0,0,0,0.15);
        }

        h1{
            color: #111827;
        }

        p{
            font-size: 18px;
        }

        button{
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover{
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="perfil-box">

    <h1>Meu Perfil</h1>

    <p><strong>Nome:</strong> Luís</p>

    <p><strong>Pontos:</strong> 1250</p>

    <p><strong>Nível:</strong> Intermediário</p>

    <p><strong>Esporte Favorito:</strong> Academia</p>

    <button>Editar Perfil</button>

</div>

</body>
</html>
