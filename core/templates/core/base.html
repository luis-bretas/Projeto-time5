<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Move Together{% endblock %}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f6f9;
        }

        nav{
            background:#111827;
            display:flex;
            justify-content:center;
            gap:30px;
            padding:18px;
            flex-wrap:wrap;
        }

        nav a{
            color:white;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        nav a:hover{
            color:#60a5fa;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:40px auto;
        }

        {% block css %}
        {% endblock %}

    </style>

</head>

<body>

<nav>

    <a href="/">Home</a>

    <a href="/login/">Login</a>

    <a href="/dashboard/">Dashboard</a>

    <a href="/grupo/">Grupo</a>

    <a href="/perfil/">Perfil</a>

    <a href="/ranking/">Ranking</a>

    <a href="/atividade/">Atividade</a>

</nav>

<div class="container">

{% block content %}

{% endblock %}

</div>

</body>
</html>
