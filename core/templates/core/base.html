<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Move Together{% endblock %}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#0f172a
            color:white;
        }

        nav{
    background:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:35px;
    padding:22px;
    flex-wrap:wrap;
    border-bottom:1px solid #1f2937;
}

        nav a{
    color:#d1d5db;
    text-decoration:none;
    font-weight:bold;
    font-size:17px;
    transition:.3s;
}

        nav a:hover{
            color:#f97316;
        }

        .container{
            width:94%;
            max-width:1600px;
            margin:35px auto;
        }

        {% block css %}
        {% endblock %}

    </style>

</head>

<body>

<nav>

    <a href="/">Home</a>

    <a href="/login/">Login</a>

    <a href="/dashboard/">Dashboard</a>

    <a href="/grupo/">Grupo</a>

    <a href="/perfil/">Perfil</a>

    <a href="/ranking/">Ranking</a>

    <a href="/atividade/">Atividade</a>

</nav>

<div class="container">

{% block content %}

{% endblock %}

</div>

</body>
</html>
