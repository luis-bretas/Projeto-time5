<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Move Together</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box{
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            width: 320px;

            box-shadow: 0px 0px 20px rgba(0,0,0,0.3);
        }

        h1{
            text-align: center;
            margin-bottom: 10px;
            color: #0f172a;
        }

        p{
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        input{
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 8px;

            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 8px;

            background-color: #2563eb;
            color: white;

            font-size: 16px;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover{
            background-color: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Move Together</h1>

        <p>Faça login para continuar</p>

        <form>

            <input type="email" placeholder="Digite seu email">

            <input type="password" placeholder="Digite sua senha">

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>

</html>
