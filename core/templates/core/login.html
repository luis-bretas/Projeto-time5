<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Move Together</title>

    <style>

        body{
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #0b1633, #142850);

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box{
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            text-align: center;
        }

        h1{
            color: #0b1633;
            margin-bottom: 10px;
        }

        p{
            color: gray;
            margin-bottom: 30px;
        }

        input{
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;

            border: 1px solid #ccc;
            border-radius: 10px;

            box-sizing: border-box;
        }

        button{
            width: 100%;
            padding: 15px;

            background: #2563eb;
            color: white;

            border: none;
            border-radius: 10px;

            cursor: pointer;

            font-size: 20px;
        }

        button:hover{
            background: #1d4ed8;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h1>Move Together</h1>

        <p>Faça login para continuar</p>

        <form>

            <input type="email" placeholder="Digite seu email">

            <input type="password" placeholder="Digite sua senha">

            <button type="submit">
                Entrar
            </button>

        </form>

    </div>

</body>
</html>
