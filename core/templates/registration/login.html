{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Move Together</title>

    <style>

         :root {
        --bg-gradient: radial-gradient(circle, #1e40af 0%, #1e3a8a 100%);
        --glass-bg: rgba(255, 255, 255, 0.15);
        --glass-border: rgba(255, 255, 255, 0.2);
        --primary-green: #22c55e;
        --text-main: #ffffff;
        --text-muted: #cbd5e1;
    }

    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-gradient);
        font-family: 'Inter', -apple-system, sans-serif;
    }

    .login-container {
        width: 90%;
        max-width: 400px;
        padding: 40px 30px;
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid var(--glass-border);
        border-radius: 30px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        text-align: center;
    }

    .logo-box {
        width: 80px;
        height: 80px;
        background: #000;
        border-radius: 20px;
        margin: 0 auto 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    /* Estilização do ícone neon da imagem */
    .logo-icon {
        font-size: 40px;
        filter: drop-shadow(0 0 8px #f97316);
    }

    h1 {
        color: var(--text-main);
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 8px;
    }

    p.subtitle {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 35px;
    }

    .form-group {
        margin-bottom: 20px;
        position: relative;
    }

    .form-control {
        width: 100%;
        padding: 15px 20px 15px 50px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50px;
        color: white;
        font-size: 16px;
        box-sizing: border-box;
        transition: all 0.3s ease;
    }

    .form-control::placeholder {
        color: rgba(255, 255, 255, 0.5);
    }

    .form-control:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
    }

    .input-icon {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: rgba(255, 255, 255, 0.6);
    }

    .btn-login {
        width: 100%;
        padding: 15px;
        background: var(--primary-green);
        border: none;
        border-radius: 50px;
        color: white;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
        transition: transform 0.2s, background 0.3s;
    }

    .btn-login:hover {
        background: #16a34a;
        transform: translateY(-2px);
    }

    .btn-login:active {
        transform: translateY(0);
    }

    .footer-links {
        margin-top: 25px;
        font-size: 14px;
    }

    .footer-links a {
        color: var(--text-muted);
        text-decoration: none;
    }

    .footer-links a:hover {
        color: white;
    }

    </style>

</head>

<body>
    <div class="login-container">
    <div class="logo-box">
        <!-- Ícone representativo do MoveTogether -->
        <span class="logo-icon"><img src="{% static 'img/Logo.png' %}" alt="Logotipo do Movetogether"></span>
    </div>

    <h1>Bem-vindo de volta!</h1>
    <p class="subtitle">Sua dose diária de movimento começa aqui</p>

    <form method="post" >
        {% csrf_token %}
        
        <div class="form-group">
            <span class="input-icon">📧</span>
            <input type="text" name="username" class="form-control" placeholder="username" required>
        </div>

        <div class="form-group">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" class="form-control" placeholder="Senha" required>
        </div>

        <button type="submit" class="btn-login">Entrar</button>
    </form>

    
</div>

</body> 

</html>
